[project]
name = "propsearch"
version = "0.1.0"
description = "Bilingual (Arabic / Franco-Arabic / English) conversational property search: NL query -> structured filters + hybrid retrieval + grounded answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mrwan Awad" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=2.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "langfuse>=3.0",
]

[project.optional-dependencies]
# Full Arabic normalisation through camel-tools (pulls torch); a built-in equivalent is used without it.
nlp = ["camel-tools>=1.5"]
# bge-m3 embeddings and bge-reranker-v2-m3 cross-encoder.
ml = ["sentence-transformers>=3.0"]
eval = ["ranx>=0.3.20"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]
# Embedded Postgres + pgvector for local tests without Docker (CI uses a service container instead).
localdb = ["pgserver>=0.1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propsearch"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]  # ruff format owns line length; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: needs a Postgres with pgvector (DATABASE_URL)"]
